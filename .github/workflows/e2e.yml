name: e2e.yml

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: "Selenium - Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl pytest pytest-html requests selenium
      - name: Run Selenium Website Tests (300 Cases)
        run: |
          cd backend
          python generate_excel_report.py selenium
      - name: Upload Selenium Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_Website_300_Test_Results_Excel
          path: backend/selenium_300_test_results.xlsx

  appium-tests:
    name: "Appium - Android Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl pytest pytest-html Appium-Python-Client
      - name: Run Appium Mobile Tests (300 Cases)
        run: |
          cd backend
          python generate_excel_report.py appium
      - name: Upload Appium Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appium_Android_300_Test_Results_Excel
          path: backend/appium_300_test_results.xlsx

  api-tests:
    name: "Unit Tests - API (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl pytest pytest-html httpx passlib "bcrypt==3.2.2"
      - name: Run API Unit Tests (300 Cases)
        run: |
          cd backend
          python generate_excel_report.py api
      - name: Upload API Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API_Unit_300_Test_Results_Excel
          path: backend/api_300_test_results.xlsx

  validation-tests:
    name: "Validation Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl pytest pytest-html opencv-python-headless numpy
      - name: Run Image Validation Tests (300 Cases)
        run: |
          cd backend
          python generate_excel_report.py validation
      - name: Upload Validation Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Validation_300_Test_Results_Excel
          path: backend/validation_300_test_results.xlsx

  deployment-tests:
    name: "Deployment Status (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl pytest pytest-html requests
      - name: Run Deployment Status Tests (300 Cases)
        run: |
          cd backend
          python generate_excel_report.py deployment
      - name: Upload Deployment Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deployment_Status_300_Test_Results_Excel
          path: backend/deployment_300_test_results.xlsx

  load-tests:
    name: "Load Testing - Performance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl locust
      - name: Run Performance Load Test
        run: |
          cd backend
          python generate_excel_report.py load
      - name: Upload Load Testing Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Load_Testing_Performance_Excel
          path: backend/load_testing_performance_results.xlsx

  master-report:
    name: "Master Report & Deploy"
    needs: [selenium-tests, appium-tests, api-tests, validation-tests, deployment-tests, load-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install openpyxl
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Generate Master 1800 Test Cases Excel Report
        run: |
          python backend/generate_excel_report.py
      - name: Upload Master 1800 Test Cases Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaqueCheck_Master_1800_Test_Results_Excel
          path: plaquecheck_master_1800_test_results.xlsx
