name: 06 - Load & Performance Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  load-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust opencv-python-headless numpy passlib bcrypt uvicorn

      - name: Start FastAPI server in background
        run: |
          cd backend
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run Locust Load Test (10, 25, 50, 100, 250 virtual users profile)
        run: |
          cd backend
          locust -f tests/load/locustfile.py --host http://127.0.0.1:8000 --headless -u 50 -r 10 --run-time 30s --html locust_report.html

      - name: Upload Locust Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: locust-load-test-report
          path: backend/locust_report.html
