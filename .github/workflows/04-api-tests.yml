name: 04 - API Tests (300 Cases)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html httpx requests opencv-python-headless numpy passlib "bcrypt==3.2.2"

      - name: Run 300 API Test Cases
        env:
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/api/ --html=api_test_report.html --self-contained-html --junitxml=api_junit.xml

      - name: Upload API Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            backend/api_test_report.html
            backend/api_junit.xml
