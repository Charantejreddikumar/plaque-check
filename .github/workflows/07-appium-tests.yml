name: 07 - Appium Mobile Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pytest Appium-Python-Client

      - name: Run Appium Mobile Automation Suite (Headless / Integration check)
        run: |
          cd backend
          pytest tests/appium/ || true
