name: 03 - Python Unit Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html httpx requests opencv-python-headless numpy passlib "bcrypt==3.2.2"

      - name: Run Python Unit Tests
        env:
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/unit/ --cov=. --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload Python Unit Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-unit-coverage
          path: backend/coverage.xml
