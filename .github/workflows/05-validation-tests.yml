name: 05 - Validation Tests (300 Cases)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html httpx requests opencv-python-headless numpy passlib "bcrypt==3.2.2"

      - name: Run 300 Validation Test Cases
        env:
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/validation/ --html=validation_test_report.html --self-contained-html --junitxml=validation_junit.xml

      - name: Upload Validation Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-reports
          path: |
            backend/validation_test_report.html
            backend/validation_junit.xml
